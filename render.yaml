databases:
  - name: xxls-salon-db
    databaseName: xxls_salon
    user: xxls_salon
    plan: free
    region: singapore

services:
  - type: web
    name: xxls-salon
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /healthz.php
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: xxls-salon-db
          property: connectionString
      - key: ADMIN_NAME
        value: Salon Administrator
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
